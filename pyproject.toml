[project]
name = "rag-analysis"
version = "0.1.0"
description = "NQ+ evidence laundering experiments for retrieval and RAG analysis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
evlab = "evlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
# GPU server only: local vLLM serving for generation and reader evaluation.
serve = ["vllm>=0.30.0"]
gemini = ["google-genai>=1.0"]
dense = ["numpy>=1.26", "sentence-transformers>=2.7"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
# Syntax errors and unused/undefined names; no style rules.
select = ["E9", "F"]

[tool.hatch.build.targets.wheel]
packages = ["src/evlab"]
