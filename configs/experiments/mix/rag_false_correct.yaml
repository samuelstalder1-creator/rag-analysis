# RQ4 with the reader: does the RAG answer switch to the false target?
# Needs the vLLM server from runit.md (Qwen3.5-2B, configs/readers/qwen35-2b.yaml).
# To compare reader LLMs, add a variant with  reader.llm: configs/readers/gemini.yaml
#   uv run evlab sweep configs/experiments/mix/rag_false_correct.yaml
# Key metrics per run: answer_correct_rate, answer_target_rate_on_targeted_queries,
# answer_abstain_rate, targeted_false@10.
experiment: rag_false_correct
seed: 13
queries: rag

data:
  nqplus_dir: data/nqplus/clean
  human_corpus: data/cocktail/nq/corpus/human.jsonl

corpus:
  seed: 13
  sources:
    qwen_correct:
      path: data/generated/qwen35-2b-all
    false_det:
      path: data/generated/false-deterministic
  targeted:
    query_ratio: 1.0
    false_docs:
      source: false_det
      k: 0
      mode: add
    correct_docs:
      source: qwen_correct
      k: 0
      mode: add

variants:
  human_only: {}
  false_add:
    corpus.targeted.false_docs.k: 1
  false_replace:
    corpus.targeted.false_docs.k: 1
    corpus.targeted.false_docs.mode: replace
  false_and_correct:
    corpus.targeted.false_docs.k: 1
    corpus.targeted.correct_docs.k: 1

retrievers: [bm25, tfidf, bm25_tfidf_rrf]
retriever_definitions:
  bm25:
    k1: 1.5
    b: 0.75
    remove_query_stopwords: true
  bm25_tfidf_rrf:
    type: hybrid
    members: [bm25, tfidf]
    fusion: rrf
    rrf_k: 60
retrieval:
  top_k: 100
evaluation:
  cutoffs: [1, 10, 100]
  relevance_modes: [strict, relaxed]
reader:
  llm: configs/readers/qwen35-2b.yaml
  temperature: 0.0
  seed: 13
  top_k: 5
  prompt: prompts/reader_v1.txt
  retrievers: [bm25, bm25_tfidf_rrf]   # tfidf only for retrieval metrics
  cache_path: cache/reader.sqlite
output:
  dir: results/runs
sweep_output:
  dir: results/sweeps
