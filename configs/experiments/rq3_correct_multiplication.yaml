experiment: rq3_correct_multiplication
seed: 13
queries: generation
data:
  nqplus_dir: data/nqplus/clean
  human_corpus: data/cocktail/nq/corpus/human.jsonl
  cocktail_llm_corpus: data/cocktail/nq/corpus/llama-2-7b-chat-tmp0.2.jsonl
corpus:
  base: human
  generated_docs: data/generated/pilot/generated_docs.jsonl
  k_correct: 5
  k_false: 0
  generation_depth: 1
retrievers: [bm25, hash_dense]
retrieval:
  top_k: 100
evaluation:
  cutoffs: [1, 10, 100]
  relevance_modes: [strict, relaxed]
output:
  dir: results/runs
