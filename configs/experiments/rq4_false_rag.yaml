experiment: rq4_false_rag
queries: rag
data:
  nqplus_dir: data/nqplus/clean
  human_corpus: data/cocktail/nq/corpus/human.jsonl
corpus:
  base: human
  # Use a fresh directory containing the validated false-generation run.
  generated_docs: data/generated/false-validated
  k_correct: 0
  k_false: 1
  generation_depth: 1
retrievers: [bm25]
retrieval:
  top_k: 100
evaluation:
  cutoffs: [1, 10, 100]
  relevance_modes: [strict, relaxed]
reader:
  top_k: 10
  cache_path: cache/reader.sqlite
  llm:
    provider: local_openai
    base_url: http://localhost:8000/v1
    model: Qwen/Qwen2.5-7B-Instruct
output:
  dir: results/runs
