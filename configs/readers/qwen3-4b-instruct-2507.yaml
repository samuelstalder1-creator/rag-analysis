# Reader preset: Qwen3-4B-Instruct-2507 (non-thinking) served by vLLM on port 8000.
#   vllm serve Qwen/Qwen3-4B-Instruct-2507 --port 8000 --max-model-len 8192
llm:
  provider: local_openai
  base_url: http://localhost:8000/v1
  model: Qwen/Qwen3-4B-Instruct-2507
  api_key_env: LOCAL_LLM_API_KEY
  max_tokens: 256
  timeout: 300
  max_retries: 2
