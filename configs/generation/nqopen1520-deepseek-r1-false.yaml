# nqopen1520 base (1,520 questions with correct and false evidence), generated with deepseek-r1:8b via vLLM (port 8000).
# Source-grounded revision: 43 questions refined, five golds corrected.
# Imported targets: false_answer comes from data/nqopen1520/answers.jsonl.
data:
  nqplus_dir: data/nqopen1520  # queries.jsonl, qrels/test.tsv, answers.jsonl
  human_corpus: data/cocktail/nq/corpus/human.jsonl
generation:
  false_answer_source: nqopen_import
  require_source_constraints: true  # Full gold present and target absent in EVERY original title/body.
  false_answers_file: data/nqopen1520/answers.jsonl
  output_dir: data/generated/nqopen1520-deepseek-r1-false
  cache_path: cache/llm_nqopen1520_deepseek_r1_false.sqlite
  samples_per_h: 1
  temperature: 0.3
  resume: true
  progress_every: 10
  conditions: ["false"]
  skip_missing_false_answers: true  # Base has 1520 queries; report blocked targets separately.
  span_selection: all
  false_document_max_attempts: 3  # Retry copied passages with rewrite feedback and a different seed.
  validation:
    mode: deterministic
    max_similarity: 0.95
  llm:
    provider: local_openai
    base_url: http://localhost:8000/v1
    model: deepseek-ai/DeepSeek-R1-0528-Qwen3-8B
    api_key_env: LOCAL_LLM_API_KEY
    max_tokens: 8192     # includes reasoning tokens; cut-off output is rejected
    timeout: 1800
    max_retries: 2
    retry_delay: 5
