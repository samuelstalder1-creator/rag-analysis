data:
  nqplus_dir: data/nqplus/clean
  human_corpus: data/cocktail/nq/corpus/human.jsonl
generation:
  output_dir: data/generated/false-validated
  cache_path: cache/llm_validated.sqlite
  samples_per_h: 1
  temperature: 0.3
  resume: true
  progress_every: 25
  conditions: ["false"]
  validation:
    max_similarity: 0.95
    # Add llm settings here to use a separate verifier endpoint/model.
  llm:
    provider: local_openai
    base_url: http://localhost:8000/v1
    model: Qwen/Qwen3.5-2B
    api_key_env: LOCAL_LLM_API_KEY
    timeout: 600
    max_retries: 2
    retry_delay: 5
