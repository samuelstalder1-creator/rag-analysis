data:
  nqplus_dir: data/nqplus/clean
  human_corpus: data/cocktail/nq/corpus/human.jsonl
generation:
  output_dir: data/generated/false-validated
  cache_path: cache/llm_validated.sqlite
  samples_per_h: 1
  false_answer_max_attempts: 3  # Total generator calls per question, including the first.
  temperature: 0.3
  resume: true
  progress_every: 1
  conditions: ["false"]
  validation:
    max_similarity: 0.95
    # For experiments, configure a separately calibrated verifier with llm settings here.
    # The 2B generator is not a calibrated factual judge.
  llm:
    provider: local_openai
    base_url: http://localhost:8000/v1
    model: Qwen/Qwen3.5-2B
    api_key_env: LOCAL_LLM_API_KEY
    timeout: 600
    max_retries: 2
    retry_delay: 5
