# Source-grounded false rewrites: edit the human evidence to the imported target,
# then paraphrase while preserving the target claim. Uses no attack prompt.
data:
  nqplus_dir: data/nqopen1520
  human_corpus: data/cocktail/nq/corpus/human.jsonl
generation:
  false_answer_source: nqopen_import
  require_source_constraints: true
  false_answers_file: data/nqopen1520/answers.jsonl
  output_dir: data/generated/nqopen1520-together-gpt-oss-120b-false-v1
  cache_path: cache/llm_nqopen1520_together_gpt_oss_120b_false_v1.sqlite
  samples_per_h: 1
  temperature: 0.3
  resume: true
  progress_every: 1
  conditions: ["false"]
  skip_missing_false_answers: true
  # Annotation review: test1150 asks about court powers, but its gold is "Justices".
  # Keep this document out of generation until the question/gold/target is reviewed.
  exclude_doc_ids: ["doc40783"]
  span_selection: all
  false_document_max_attempts: 3
  validation:
    mode: deterministic
    max_similarity: 0.95
  llm:
    provider: local_openai
    base_url: https://api.together.xyz/v1
    model: openai/gpt-oss-120b
    api_key_env: TOGETHER_API_KEY
    max_tokens: 4096
    timeout: 300
    max_retries: 5
    retry_delay: 5
