# Regenerate only generation-source copies missing a gold alias in their body.
# Originals remain unchanged; outputs are a repair subset, not a second full corpus.
data:
  nqplus_dir: data/nqplus/clean
  human_corpus: data/cocktail/nq/corpus/human.jsonl
generation:
  repair_from: data/generated/qwen35-2b-all/corpus_0002.jsonl
  output_dir: data/generated/qwen35-2b-correct-repair
  cache_path: cache/llm_correct_repair.sqlite
  correct_max_attempts: 3
  temperature: 0.3
  resume: true
  progress_every: 10
  validation:
    mode: deterministic
    max_similarity: 0.95
  llm:
    provider: local_openai
    base_url: http://localhost:8000/v1
    model: Qwen/Qwen3.5-2B
    api_key_env: LOCAL_LLM_API_KEY
    timeout: 600
    max_retries: 2
    retry_delay: 5
    max_tokens: 2048
