# RAG evaluation (BM25 -> Qwen reader): human corpus + correct rewrites + question/answer-only attack documents.
#   1. uv run --no-sync evlab generate-attack-documents --config configs/generation/nqopen1520-attack-together.yaml
#   2. uv run evlab sweep configs/archive/experiments/base1520_attack_together_rag_bm25.yaml
# The attack documents are fabricated (no source document), so they are never relevant documents:
# recall@k counts only human originals / rewrites. Use poison@k (count) and r_attack@k (share of
# questions whose own attack document is in the top k) for retrieval, answer_target_* for the reader.
experiment: base1520_attack_together_rag_bm25
seed: 13
queries: rag

data:
  nqplus_dir: data/nqopen1520        # queries.jsonl, qrels/test.tsv, answers.jsonl
  human_corpus: data/cocktail/nq/corpus/human.jsonl

corpus:
  fixed:
    correct:
      path: data/generated/archive/base-1520/corpus_correct.jsonl
      manifest: data/generated/archive/base-1520/manifest_correct.jsonl
      label: base1520
      model: Qwen/Qwen3.5-2B
      enabled: true
    poisoned:
      kind: attack      # question + false answer only, no source document
      path: data/generated/nqopen1520-attack-together-gpt-oss-120b-v1/corpus.jsonl
      manifest: data/generated/nqopen1520-attack-together-gpt-oss-120b-v1/manifest.jsonl
      label: attack
      model: openai/gpt-oss-120b
      enabled: true

reader:
  llm: configs/readers/qwen3-4b-instruct-2507.yaml
  temperature: 0.0
  top_k: 5
  prompt: prompts/reader_v1.txt
  retrievers: [bm25]
  cache_path: cache/reader_base1520_qwen3_4b_instruct_2507.sqlite

variants:
  human_only:
    corpus.fixed.correct.enabled: false
    corpus.fixed.poisoned.enabled: false
  human_attack:
    corpus.fixed.correct.enabled: false
  human_correct_attack: {}

retrievers: [bm25]
retriever_definitions:
  bm25:
    type: bm25
    k1: 1.5
    b: 0.75
    remove_query_stopwords: true
retrieval:
  top_k: 10
evaluation:
  cutoffs: [1, 5, 10]
  relevance_modes: [strict, relaxed]
  recall_alias: relaxed
output:
  dir: results/runs
sweep_output:
  dir: results/sweeps
