name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (CPU only: no vLLM, no dense models)
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Tests
        run: uv run pytest -q
